<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OVER SOUL - OS Terminal v3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* --- [ 기본 설정 및 배경 (이전과 동일) ] --- */
        :root {
            --bg-base: #020202; --gold-main: #d4af37; --gold-bright: #ffe680;
            --gold-dim: #5c4b1a; --danger: #ff2a2a; --matrix-green: #44ff44;
            --font-title: 'Orbitron', sans-serif; --font-data: 'Share Tech Mono', monospace;
            --cyber-glow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        body {
            margin: 0; background-color: var(--bg-base); color: var(--gold-main);
            font-family: var(--font-data); overflow-x: hidden; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999; background-size: 100% 3px, 4px 100%; pointer-events: none; opacity: 0.6;
        }

        h1, h2, h3 { font-family: var(--font-title); margin: 0; }
        .cyber-border { border: 1px solid var(--gold-dim); background: rgba(10, 10, 10, 0.7); position: relative; }

        /* 헤더 및 네비게이션 간소화 탑재 */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--gold-dim); background: rgba(2, 2, 2, 0.95); position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.3rem; color: var(--gold-bright); letter-spacing: 2px; }
        .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; padding: 5px;}
        .hamburger div { width: 22px; height: 2px; background-color: var(--gold-main); }
        
        #sidebar { position: fixed; top: 0; right: -100%; width: 230px; height: 100vh; background: rgba(5, 5, 5, 0.98); border-left: 1px solid var(--gold-main); transition: 0.3s; display: flex; flex-direction: column; padding: 60px 15px 30px; z-index: 90; }
        #sidebar.open { right: 0; }
        .menu-item { font-family: var(--font-title); font-size: 1rem; margin-bottom: 20px; color: var(--gold-dim); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .menu-item.active-menu { color: var(--gold-bright); text-shadow: var(--cyber-glow); font-weight: bold; }

        #main-content > div { display: none; padding: 15px; padding-bottom: 50px; min-height: calc(100vh - 70px); box-sizing: border-box;}
        .view-title { font-size: 1.1rem; color: var(--gold-bright); margin-bottom: 15px; display:flex; justify-content:space-between; align-items:center; }
        .view-title-decor { flex-grow: 1; height: 1px; background: var(--gold-dim); margin-left: 10px; position: relative;}

        /* --- [ 인물 데이터 뷰 ] --- */
        .filter-container { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 15px; }
        .filter-btn { flex: 1 1 calc(33% - 4px); background: transparent; border: 1px solid var(--gold-dim); color: var(--gold-dim); padding: 7px 0; font-family: var(--font-title); font-size: 0.7rem; cursor: pointer; }
        .filter-btn.active { background: rgba(212, 175, 55, 0.15); border-color: var(--gold-bright); color: var(--gold-bright); text-shadow: var(--cyber-glow); }

        .char-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .char-card { padding: 10px; font-size: 0.7rem; border-color: rgba(212, 175, 55, 0.2); transition: 0.3s; cursor: pointer;}
        .char-card:active { transform: scale(0.95); border-color: var(--gold-bright); }
        .card-header { display: flex; justify-content: space-between; color: var(--gold-dim); font-size: 0.6rem; margin-bottom: 4px; }
        .char-name { font-size: 1rem; color: #fff; font-weight: bold; font-family: var(--font-title); margin-bottom: 2px; }
        .char-faction { color: var(--gold-main); text-transform: uppercase; margin-bottom: 5px; border-bottom: 1px solid rgba(212, 175, 55, 0.1);}

        /* --- [ 인물 상세 모달 (Popup) - 핵심 추가 기능 ] --- */
        #char-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 500; backdrop-filter: blur(5px);
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            width: 100%; max-width: 400px; max-height: 85vh; background: #080808;
            border: 2px solid var(--gold-main); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            overflow-y: auto; position: relative; padding: 20px;
        }
        /* 스크롤바 디자인 */
        .modal-content::-webkit-scrollbar { width: 5px; }
        .modal-content::-webkit-scrollbar-thumb { background: var(--gold-dim); }

        .modal-close {
            position: absolute; top: 10px; right: 15px; color: var(--gold-bright);
            font-size: 1.5rem; cursor: pointer; font-family: var(--font-title);
        }
        .m-header { border-bottom: 1px dashed var(--gold-dim); padding-bottom: 10px; margin-bottom: 15px; }
        .m-name { font-size: 1.5rem; color: #fff; font-weight: bold; font-family: var(--font-title); }
        .m-faction { font-size: 0.9rem; color: var(--gold-main); }
        
        .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .m-stat-box { border: 1px solid rgba(212, 175, 55, 0.3); padding: 8px; background: rgba(20, 20, 20, 0.5); }
        .m-label { font-size: 0.65rem; color: var(--gold-dim); display: block; margin-bottom: 2px; }
        .m-val { font-size: 0.85rem; color: var(--gold-bright); font-weight: bold; }
        
        .m-section { margin-bottom: 15px; }
        .m-section-title { font-size: 0.8rem; color: var(--gold-main); border-left: 3px solid var(--gold-bright); padding-left: 5px; margin-bottom: 5px; }
        .m-desc { font-size: 0.8rem; color: #ddd; line-height: 1.5; background: rgba(0,0,0,0.5); padding: 10px; border: 1px dotted var(--gold-dim); }
        
        .tag { display: inline-block; padding: 2px 6px; background: var(--gold-dim); color: #000; font-size: 0.65rem; border-radius: 3px; margin-right: 4px; margin-bottom: 4px; font-weight: bold;}

    </style>
</head>
<body>

    <header>
        <h1 onclick="navTo('character')">O.S Terminal</h1>
        <div class="hamburger" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>
    </header>

    <div id="sidebar">
        <div class="menu-item active-menu" id="nav-character" onclick="navTo('character')">> DB_CHARACTERS</div>
        <div class="menu-item" style="color:#555">TACTICAL_MAP (LOCKED)</div>
        <div class="menu-item" style="color:#555">SYSTEM_CONFIG (LOCKED)</div>
    </div>

    <div id="main-content">
        <div id="character-view" style="display: block;">
            <div class="view-title">
                DB_ENTITIES <div class="view-title-decor"></div>
            </div>
            
            <div class="filter-container">
                <button class="filter-btn active" onclick="filterData('ALL', this)">ALL</button>
                <button class="filter-btn" onclick="filterData('애스터', this)">ASTER</button>
                <button class="filter-btn" onclick="filterData('델라쿠르아', this)">DELACRUA</button>
            </div>

            <div class="char-grid" id="char-container">
                </div>
        </div>
    </div>

    <div id="char-modal">
        <div class="modal-content">
            <div class="modal-close" onclick="closeModal()">×</div>
            
            <div class="m-header">
                <div class="m-faction" id="md-faction">[FACTION]</div>
                <div class="m-name" id="md-name">CHARACTER NAME</div>
                <div style="margin-top:8px;" id="md-tags">
                    </div>
            </div>

            <div class="m-grid">
                <div class="m-stat-box">
                    <span class="m-label">THREAT_LEVEL</span>
                    <span class="m-val" id="md-rank" style="color:#ff2a2a">SS</span>
                </div>
                <div class="m-stat-box">
                    <span class="m-label">AGE</span>
                    <span class="m-val" id="md-age">00</span>
                </div>
                <div class="m-stat-box">
                    <span class="m-label">MBTI</span>
                    <span class="m-val" id="md-mbti">XXXX</span>
                </div>
                <div class="m-stat-box">
                    <span class="m-label">ENNEAGRAM</span>
                    <span class="m-val" id="md-ennea">XwX</span>
                </div>
            </div>

            <div class="m-section">
                <div class="m-section-title">COMBAT_DATA</div>
                <div class="m-desc">
                    <span style="color:var(--gold-main)">[레조넌스]</span> <span id="md-reso">데이터 없음</span><br>
                    <span style="color:var(--gold-main)">[능력]</span> <span id="md-ability">데이터 없음</span><br>
                    <span style="color:var(--gold-main)">[커튼콜]</span> <span id="md-curtain">미개방</span><br>
                    <span style="color:var(--gold-main)">[상태]</span> 조율: <span id="md-tune">X</span> / 백스테이지: <span id="md-back">X</span> / 오버소울: <span id="md-over">X</span>
                </div>
            </div>

            <div class="m-section">
                <div class="m-section-title">PERSONAL_RECORD</div>
                <div class="m-desc" id="md-detail" style="color:#aaa;">
                    상세 기록 데이터 출력 공간.
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
        function navTo(viewId) { /* 간소화 네비게이션 */ }

        // --- 상세 업데이트된 캐릭터 데이터베이스 ---
        const charDB = [
            { 
                name: "엘라라(가주)", faction: "애스터", rank: "SS", age: 52, mbti: "ENTP", ennea: "8w7",
                tags: ["보수파", "메스가키", "츤데레"], reso: "지휘", ability: "지휘를 통한 염력 등 복합 능력",
                curtain: "모든 공격 위력 2배 및 대상 필중", tune: "가능", back: "가능", over: "경험함",
                detail: "애스터 가문의 가주. 조율을 외모에 쓰지 않아도 어린 꼬마처럼 보이는 외모를 지녔다. 항상 도발적이고 마음에 들수록 더 놀리는 '메스가키' 성향이지만, 속은 츤데레. 가문에 의한 원치 않은 결혼으로 남편은 딸 루나를 낳기 전 사망했으나, 유일한 핏줄인 루나만큼은 진심으로 사랑한다."
            },
            { 
                name: "루나", faction: "애스터", rank: "A", age: 24, mbti: "INFJ", ennea: "9w1",
                tags: ["후계자", "진보파", "내향적"], reso: "지휘 (열화판)", ability: "어머니와 같으나 위력/범위가 크게 떨어짐",
                curtain: "미개방", tune: "불가", back: "불가", over: "미경험",
                detail: "엘라라의 친딸이자 애스터의 후계자 후보. 어머니와 정반대로 조용하고 내향적이며 진보파에 속해 있다. 압도적인 천재인 어머니에게 열등감을 느끼고 있으며, 전투적 재능은 어머니에 한참 미치지 못한다."
            },
            { 
                name: "루시", faction: "애스터", rank: "S", age: 23, mbti: "ESFP", ennea: "3w4",
                tags: ["애리나 소속", "약메스가키", "나르시스트"], reso: "피아노", ability: "전투 시작 시 악보 제작 후 연주. 레조넌스 무제한화.",
                curtain: "악보 제작 속도 3배. 곡 분위기에 따른 특수효과.", tune: "불가 (오버플로우 방어용 강제 발동)", back: "가능", over: "미경험",
                detail: "애스터 산하 애리나 가문의 후계자 후보. 활발하고 언제나 앞장서며 약간의 나르시시즘을 가졌다. 연주 시 폭주하는 무한한 레조넌스를 육체가 버티지 못해 '조율'이 강제 패시브로 발동하며, 이로 인해 사실상 죽지 않는 '불사'에 가까운 전투를 펼친다."
            },
            { 
                name: "시몬(가주)", faction: "델라쿠르아", rank: "S", age: 60, mbti: "ISTJ", ennea: "1w9",
                tags: ["보수파", "과묵함", "외유내강"], reso: "첼로", ability: "중력 및 질량 조작 (첼로의 저음으로 공간 압박)",
                curtain: "능력 2배 강화 및 필중", tune: "가능", back: "가능", over: "경험함",
                detail: "델라쿠르아 가문의 가주. 옛날 반역자들에게 남편을 잃은 슬픔을 간직하고 있다. 조용하고 말이 적지만 뒤에서 은근히 아랫사람들을 챙겨주는 따뜻함이 있다. 보수파 수장이지만 진보 세력의 변화를 억지로 막지는 않는 합리주의자."
            },
            { 
                name: "사라", faction: "델라쿠르아", rank: "B+", age: 20, mbti: "ISFJ", ennea: "6w5",
                tags: ["후계자", "과묵함"], reso: "바이올린", ability: "염력",
                curtain: "대상 필중", tune: "불가", back: "불가", over: "미경험",
                detail: "시몬의 친딸이자 후계자. 어머니 시몬을 빼닮아 차분하고 과묵한 성격이다. 어머니처럼 공간을 짓누르는 거대한 힘은 없지만, 바이올린의 날카로운 선율을 이용해 정밀한 염력 타격을 가한다."
            },
            { 
                name: "시안", faction: "델라쿠르아", rank: "E", age: 18, mbti: "ISFJ", ennea: "2w1",
                tags: ["메이드", "브라콘", "일반인"], reso: "없음 (일반인)", ability: "없음",
                curtain: "-", tune: "불가", back: "불가", over: "미경험",
                detail: "송의 이란성 쌍둥이 누나. 말수가 적고 내향적이며 델라쿠르아의 메이드로 일하고 있다. 연주자로서의 재능이 아예 없는 대신, 동생을 끔찍이 아껴 동생이 재능을 온전히 키울 수 있도록 궂은일을 몰아서 대신 해주고 있다."
            },
            { 
                name: "송", faction: "델라쿠르아", rank: "A", age: 18, mbti: "ENFP", ennea: "7w6",
                tags: ["메이드", "오토코노코", "광역서포터"], reso: "클라리넷", ability: "광역 버프 및 디버프 부여",
                curtain: "능력치 3배 강화", tune: "가능", back: "불가", over: "미경험",
                detail: "시안의 쌍둥이 동생. 활발하고 말이 많다. 남성임에도 엄청나게 예쁜 외모를 가졌으며, 누나가 예쁘다며 입혀준 메이드복을 계속 입고 다니다 현재 성정체성에 깊은 혼란을 겪고 있다. 누나가 뒤에서 희생하며 자신의 일을 대신 해주고 있다는 사실을 전혀 모른다."
            }
        ];

        // 카드 렌더링
        function renderCharacters(filter) {
            const container = document.getElementById('char-container');
            container.innerHTML = ''; 
            charDB.forEach((char, index) => {
                if (filter === 'ALL' || char.faction === filter) {
                    const html = `
                        <div class="char-card cyber-border" onclick="openModal(${index})">
                            <div class="card-header"><span>ID: ${char.rank}</span> <span>[DETAILS >]</span></div>
                            <div class="char-name">${char.name}</div>
                            <div class="char-faction">${char.faction}</div>
                            <div style="color:var(--gold-dim); font-size:0.65rem;">Resonance: ${char.reso}</div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                }
            });
        }

        // 모달 열기 함수 (데이터 바인딩)
        function openModal(index) {
            const char = charDB[index];
            document.getElementById('md-faction').innerText = `[ ${char.faction} ]`;
            document.getElementById('md-name').innerText = char.name;
            document.getElementById('md-rank').innerText = char.rank;
            document.getElementById('md-age').innerText = char.age;
            document.getElementById('md-mbti').innerText = char.mbti;
            document.getElementById('md-ennea').innerText = char.ennea;
            
            document.getElementById('md-reso').innerText = char.reso;
            document.getElementById('md-ability').innerText = char.ability;
            document.getElementById('md-curtain').innerText = char.curtain;
            document.getElementById('md-tune').innerText = char.tune;
            document.getElementById('md-back').innerText = char.back;
            document.getElementById('md-over').innerText = char.over;
            document.getElementById('md-detail').innerText = char.detail;

            // 태그 생성
            const tagsDiv = document.getElementById('md-tags');
            tagsDiv.innerHTML = '';
            char.tags.forEach(t => {
                tagsDiv.innerHTML += `<span class="tag">#${t}</span>`;
            });

            document.getElementById('char-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('char-modal').style.display = 'none';
        }

        function filterData(f, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); renderCharacters(f);
        }

        renderCharacters('ALL');
    </script>
</body>
</html>
