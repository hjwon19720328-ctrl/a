<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATABASE : SECRET ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- 기본 설정 --- */
        :root {
            --bg-color: #050a0e;
            --text-color: #80ffea;
            --villain-color: #ff3333;
            --hero-color: #33ccff;
            --neutral-color: #ffffff;
            --all-color: #ffd700;
            --border-style: 2px solid var(--text-color);
            --crt-glow: 0 0 10px var(--text-color), 0 0 20px var(--text-color);
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'IBM Plex Mono', 'Noto Sans KR', monospace;
            margin: 0; padding: 40px 20px; text-align: center;
            min-height: 100vh; cursor: crosshair; overflow-x: hidden;
            animation: text-flicker 0.01s infinite alternate;
        }
        body.locked { overflow: hidden; }

        /* CRT 효과 */
        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 99999;
            animation: scanline-move 10s linear infinite;
        }
        @keyframes scanline-move { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }
        @keyframes text-flicker { 0% { opacity: 0.98; } 100% { opacity: 1; } }

        /* 터미널 인트로 */
        #intro-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 60000;
            display: flex; flex-direction: column; padding: 40px; box-sizing: border-box;
            font-family: 'IBM Plex Mono', monospace; transition: opacity 1s ease;
        }

        #intro-input-area {
            width: 100%; max-width: 900px; margin: 0 auto;
            border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 15px;
            text-align: left; font-size: 1.3em; color: var(--text-color); display: flex; align-items: center;
        }

        #prompt-char { color: #0f0; margin-right: 10px; text-shadow: 0 0 5px #0f0; white-space: nowrap; }
        #current-typing-text { display: inline; text-shadow: var(--crt-glow); }
        
        .cursor {
            display: inline-block; width: 10px; height: 1.2em;
            background-color: var(--text-color); margin-left: 5px;
            animation: blink 0.8s infinite; vertical-align: bottom;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #intro-history {
            flex: 1; width: 100%; max-width: 900px; margin: 0 auto;
            display: flex; flex-direction: column; align-items: flex-start;
            overflow-y: auto; color: #888; font-size: 1.1em; line-height: 1.6; text-align: left;
        }
        
        .history-line { animation: fadeInLine 0.2s ease-out; margin-bottom: 8px; width: 100%; }
        @keyframes fadeInLine { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .intro-highlight-red { color: var(--villain-color); text-shadow: 0 0 10px var(--villain-color); font-weight: bold; }
        .intro-highlight-blue { color: var(--hero-color); text-shadow: 0 0 10px var(--hero-color); font-weight: bold; }
        
        #skip-btn { position: absolute; bottom: 30px; right: 30px; background: transparent; border: 1px solid var(--text-color); color: var(--text-color); padding: 10px 20px; cursor: pointer; font-family: inherit; z-index: 60001; }

        /* 로그인 */
        #login-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 50000; display: none;
            flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease;
        }
        .login-box { border: 2px solid var(--text-color); padding: 40px; box-shadow: 0 0 30px var(--text-color); width: 90%; max-width: 500px; background: rgba(0, 10, 15, 0.9); }
        .login-input { background: transparent; border: none; border-bottom: 2px solid var(--text-color); color: var(--text-color); font-family: inherit; font-size: 1.5em; text-align: center; width: 80%; margin-bottom: 30px; outline: none; text-transform: uppercase; }
        .login-btn { background-color: rgba(0, 20, 30, 0.8); color: var(--text-color); border: 2px solid var(--text-color); padding: 10px 30px; cursor: pointer; font-weight: bold; font-family: inherit; }
        #login-error { color: var(--villain-color); margin-top: 20px; display: none; font-weight: bold; }
        
        #welcome-screen { display: none; text-align: center; }
        .access-granted { color: var(--hero-color); font-size: 1.5em; font-weight: bold; margin-bottom: 20px; }
        .user-greeting { font-size: 1.3em; line-height: 1.5; }
        .user-name-highlight { color: #fff; font-weight: bold; text-decoration: underline; }
        .doc-info { font-size: 0.9em; color: #aaa; border-top: 1px dashed #555; padding-top: 20px; margin-top: 20px; animation: text-flicker 2s infinite; }
        
        /* 메인 컨텐츠 (초기 숨김) */
        #main-content-wrapper { display: none; opacity: 0; transition: opacity 1s ease; }

        h1 { font-size: 2.5em; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-color); border-bottom: var(--border-style); display: inline-block; padding-bottom: 10px; }
        .main-nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .main-nav-btn { background: transparent; color: var(--text-color); border: 2px solid var(--text-color); padding: 12px 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .main-nav-btn.active, .main-nav-btn:hover { background: var(--text-color); color: #000; box-shadow: var(--crt-glow); }

        .main-section { display: none; width: 100%; max-width: 1200px; margin: 0 auto; animation: fadeIn 0.5s; }
        .main-section.active-section { display: block; }

        /* 캐릭터 카드 테마 색상 */
        #villain .section-title { color: var(--villain-color); border-bottom: 1px solid var(--villain-color); padding-bottom: 10px; }
        #villain .card .name { color: var(--villain-color); }
        #hero .section-title { color: var(--hero-color); border-bottom: 1px solid var(--hero-color); padding-bottom: 10px; }
        #hero .card .name { color: var(--hero-color); }
        #neutral .section-title { color: var(--neutral-color); border-bottom: 1px solid var(--neutral-color); padding-bottom: 10px; }
        #neutral .card .name { color: var(--neutral-color); }

        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; }
        .card { background: rgba(5, 20, 25, 0.9); border: 1px solid #444; padding: 10px; cursor: pointer; transition: 0.3s; text-align: left; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-bottom: 1px solid #333; }
        .name { font-size: 1.2em; font-weight: bold; margin-top: 10px; }

        #page-transition { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .black-out { opacity: 1 !important; pointer-events: auto !important; }

        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    </style>
</head>
<body class="locked">

    <div id="intro-layer">
        <div id="intro-input-area">
            <span id="prompt-char">시안송:~$</span>
            <span id="current-typing-text"></span><span class="cursor"></span>
        </div>
        <div id="intro-history"></div>
        <button id="skip-btn" onclick="endIntro()">SKIP >></button>
    </div>

    <div id="login-layer">
        <div class="login-box">
            <div id="login-content">
                <div class="login-title">🔒 IDENTIFICATION</div>
                <p>성함을 입력하여 접속 승인을 요청하십시오.</p>
                <input type="text" id="nameInput" class="login-input" placeholder="USER NAME" onkeypress="handleEnter(event)">
                <button class="login-btn" onclick="submitLogin()">CONNECT</button>
                <div id="login-error"></div>
            </div>
            <div id="welcome-screen">
                <div class="access-granted">ACCESS GRANTED</div>
                <div class="user-greeting">환영합니다, <br><span id="display-name" class="user-name-highlight"></span> 요원님.</div>
                <div class="doc-info">※ 본 문서는 천의(天衣)에서 작성한<br>1급 기밀 데이터입니다.</div>
            </div>
        </div>
    </div>

    <div class="crt-overlay"></div>
    <div id="page-transition"></div>

    <div id="main-content-wrapper">
        <h1>DATABASE : CHARACTER ARCHIVE</h1>
        <div class="main-nav">
            <button class="main-nav-btn active" onclick="switchMainSection(event, 'world')">WORLDVIEW</button>
            <button class="main-nav-btn" onclick="switchMainSection(event, 'org')">ORGANIZATION</button>
            <button class="main-nav-btn" onclick="switchMainSection(event, 'char')">PERSONNEL</button>
        </div>

        <div id="sec-world" class="main-section active-section">
            <div class="info-box">
                <div class="info-title">⚠️ CURRENT STATUS</div>
                <p>조직 <strong>EDEN</strong>은 능력자 중심의 신세계를 구축하려 합니다.<br>현재 엑스칼리버, 성혈, 롱기누스의 창을 탈취했으며 최후의 열쇠 <strong>[사방신의 핵]</strong>을 노리고 있습니다.</p>
            </div>
        </div>

        <div id="sec-char" class="main-section">
            <div class="tab-menu">
                <button class="tab-btn all-tab active" onclick="openTabWithTransition(event, 'all')">ALL</button>
                <button class="tab-btn villain-tab" onclick="openTabWithTransition(event, 'villain')">VILLAIN</button>
                <button class="tab-btn hero-tab" onclick="openTabWithTransition(event, 'hero')">HERO</button>
                <button class="tab-btn neutral-tab" onclick="openTabWithTransition(event, 'neutral')">NEUTRAL</button>
            </div>
            <div id="villain" class="tab-content show"><h2 class="section-title">VILLAIN_DATA</h2><div class="container"></div></div>
            <div id="hero" class="tab-content show"><h2 class="section-title">HERO_DATA</h2><div class="container"></div></div>
            <div id="neutral" class="tab-content show"><h2 class="section-title">NEUTRAL_DATA</h2><div class="container"></div></div>
        </div>
    </div>

    <script>
        const typingSound = new Audio('./typing.mp3'); 
        const bgmSound = new Audio('./bgm.mp3');
        bgmSound.loop = true; 
        typingSound.loop = true;

        document.body.addEventListener('click', () => { bgmSound.play().catch(e=>{}); }, {once:true});

        // ⭐ 인트로 타이머 변수들
        let typingTimeout; 
        let lIdx = 0; let cIdx = 0; let isSkipped = false;

        const storyLines = [
            "SYSTEM BOOT SEQUENCE INITIATED...", "LOADING HISTORY LOG...", "...",
            "조직 <span class='intro-highlight-red'>[EDEN]</span>의 최종 목표:",
            "모든 인간을 말살하고, 오직 능력자들만의 낙원을 건설하는 것.", "...",
            "하지만 그들의 야망은 <span class='intro-highlight-blue'>[천의(天衣)]</span>에 의해 저지당하고 있다.", "...",
            "경고: EDEN이 다차원 유물 데이터를 확보했습니다.",
            "> 엑스칼리버 [ACQUIRED]", "> 그리스도의 피(성혈) [ACQUIRED]", "> 롱기누스의 창 [ACQUIRED]", "...",
            "현재 상황: 최종 단계 진입.", "이제 그들에게 남은 마지막 열쇠...",
            "오직 [사방신의 핵]만이 남았다."
        ];

        function playTypingSound() {
            try {
                if (isSkipped) return;
                if (typingSound.paused) { typingSound.currentTime = 0; typingSound.play().catch(e=>{}); }
                clearTimeout(typingSound.stopTimer);
                typingSound.stopTimer = setTimeout(() => { typingSound.pause(); }, 800); 
            } catch(e){}
        }

        function typeWriter() {
            if (isSkipped) return;
            const historyLog = document.getElementById("intro-history");
            const typingSpan = document.getElementById("current-typing-text");

            if (lIdx < storyLines.length) {
                let fullText = storyLines[lIdx];
                if (fullText.includes("<span")) {
                    const p = document.createElement("div"); p.className = "history-line"; p.innerHTML = fullText;
                    historyLog.appendChild(p); typingSound.pause(); lIdx++;
                    typingTimeout = setTimeout(typeWriter, 800); 
                } else {
                    if (cIdx < fullText.length) {
                        playTypingSound(); typingSpan.innerHTML += fullText.charAt(cIdx); cIdx++;
                        typingTimeout = setTimeout(typeWriter, 50);
                    } else {
                        typingSound.pause(); const p = document.createElement("div"); p.className = "history-line";
                        p.innerHTML = fullText.includes("사방신의 핵") ? "오직 <span class='intro-highlight-blue'>[사방신의 핵]</span>만이 남았다." : typingSpan.innerText;
                        historyLog.appendChild(p); typingSpan.innerText = ""; cIdx = 0; lIdx++;
                        typingTimeout = setTimeout(typeWriter, 500); 
                    }
                }
                historyLog.scrollTop = historyLog.scrollHeight;
            } else { endIntro(); }
        }

        // ⭐ 버그 수정: 스킵 시 모든 타이머와 소리 즉시 정지
        function endIntro() {
            if (isSkipped) return;
            isSkipped = true;
            
            // 모든 인트로 타이머 클리어
            clearTimeout(typingTimeout);
            if(typingSound.stopTimer) clearTimeout(typingSound.stopTimer);
            
            // 소리 즉시 정지 및 루프 해제
            typingSound.pause();
            typingSound.loop = false;
            typingSound.currentTime = 0;

            document.getElementById("intro-layer").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("intro-layer").style.display = "none";
                document.getElementById("login-layer").style.display = "flex";
            }, 1000);
        }

        window.onload = typeWriter;

        // 로그인 및 메인 로직 (기존 동일)
        function submitLogin() {
            const name = document.getElementById("nameInput").value.trim();
            if (!name) return;
            document.getElementById("login-content").style.display = "none";
            document.getElementById("display-name").innerText = name;
            document.getElementById("welcome-screen").style.display = "block";
            setTimeout(() => {
                document.getElementById("login-layer").style.opacity = "0";
                setTimeout(() => { 
                    document.getElementById("login-layer").style.display="none"; 
                    document.body.classList.remove("locked");
                    const main = document.getElementById("main-content-wrapper");
                    main.style.display = "block";
                    setTimeout(() => { main.style.opacity = "1"; }, 50);
                }, 1000);
            }, 2000);
        }
        function handleEnter(e) { if(e.key==="Enter") submitLogin(); }

        function switchMainSection(event, sectionId) {
            const curtain = document.getElementById("page-transition");
            const clickedBtn = event.currentTarget; 
            curtain.classList.add("black-out");
            setTimeout(() => {
                const sections = document.querySelectorAll(".main-section");
                sections.forEach(s => s.classList.remove("active-section"));
                const btns = document.querySelectorAll(".main-nav-btn");
                btns.forEach(b => b.classList.remove("active"));
                const target = document.getElementById("sec-" + sectionId);
                if (target) { target.classList.add("active-section"); if(clickedBtn) clickedBtn.classList.add("active"); }
                curtain.classList.remove("black-out");
            }, 400);
        }
    </script>
</body>
</html>
