<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OVER SOUL - OS Terminal v2.5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* (이전과 동일한 기본 CSS 변수 및 배경 설정) */
        :root {
            --bg-base: #020202; --gold-main: #d4af37; --gold-bright: #ffe680;
            --gold-dim: #5c4b1a; --danger: #ff2a2a; --matrix-green: #44ff44;
            --font-title: 'Orbitron', sans-serif; --font-data: 'Share Tech Mono', monospace;
            --cyber-glow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        body {
            margin: 0; background-color: var(--bg-base); color: var(--gold-main);
            font-family: var(--font-data); overflow-x: hidden;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999; background-size: 100% 3px, 4px 100%; pointer-events: none; opacity: 0.6;
        }

        body::before {
            content:''; position: fixed; top:0; left:0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--bg-base) 0%, transparent 80%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" opacity="0.05"><path d="M10 10 L90 10 L90 90 L10 90 Z M50 10 L50 90 M10 50 L90 50" stroke="%23d4af37" stroke-width="1" fill="none"/></svg>');
            background-size: cover, 150px 150px; opacity: 0.4; pointer-events: none;
        }

        h1, h2, h3 { font-family: var(--font-title); margin: 0; }

        /* 공통 UI (헤더, 사이드바, 프레임 등 이전과 동일) */
        .sys-frame-info { position: fixed; font-size: 0.65rem; color: var(--gold-dim); z-index: 80; pointer-events: none; }
        .top-left-info { top: 5px; left: 10px; }
        .bottom-right-info { bottom: 5px; right: 10px; text-align: right; }
        .blink-dot { display: inline-block; width: 5px; height: 5px; background: var(--matrix-green); border-radius: 50%; margin-left: 5px; animation: blink 1s infinite; }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--gold-dim);
            background: rgba(2, 2, 2, 0.95); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(3px);
        }
        header h1 { font-size: 1.3rem; color: var(--gold-bright); letter-spacing: 2px; }
        .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; padding: 5px;}
        .hamburger div { width: 22px; height: 2px; background-color: var(--gold-main); }

        #sidebar {
            position: fixed; top: 0; right: -100%; width: 230px; height: 100vh; background: rgba(5, 5, 5, 0.98);
            border-left: 1px solid var(--gold-main); transition: 0.3s; display: flex; flex-direction: column; padding: 60px 15px 30px; z-index: 90;
        }
        #sidebar.open { right: 0; }
        .menu-item { font-family: var(--font-title); font-size: 1rem; margin-bottom: 20px; color: var(--gold-dim); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .menu-item.active-menu { color: var(--gold-bright); text-shadow: var(--cyber-glow); font-weight: bold; }
        
        .sys-btn { background: transparent; border: 1px solid var(--gold-dim); color: var(--gold-dim); padding: 8px; font-size: 0.8rem; cursor: pointer; margin-top: 8px; }
        .sys-btn.danger { border-color: var(--danger); color: var(--danger); }

        #main-content > div { display: none; padding: 15px; padding-bottom: 50px; min-height: calc(100vh - 70px); box-sizing: border-box;}
        .view-title { font-size: 1.1rem; color: var(--gold-bright); margin-bottom: 15px; display:flex; justify-content:space-between; align-items:center; }
        .view-title-decor { flex-grow: 1; height: 1px; background: var(--gold-dim); margin-left: 10px; position: relative;}
        .view-title-decor::after { content:''; position: absolute; right: 0; top: -2px; width: 5px; height: 5px; background: var(--gold-bright); }

        .cyber-border { border: 1px solid var(--gold-dim); background: rgba(10, 10, 10, 0.7); position: relative; }
        .decor-corners::before { content:''; position: absolute; top:-1px; left:-1px; width:8px; height:8px; border-top:2px solid var(--gold-bright); border-left:2px solid var(--gold-bright); }
        .decor-corners::after { content:''; position: absolute; bottom:-1px; right:-1px; width:8px; height:8px; border-bottom:2px solid var(--gold-bright); border-right:2px solid var(--gold-bright); }

        /* 로비 뷰 CSS 간소화 */
        #lobby-view { flex-direction: column; gap: 15px; }
        .lobby-btn { padding: 18px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-title); font-size: 1.1rem; cursor: pointer; }
        .log-container { flex-grow: 1; padding: 10px; font-size: 0.75rem; color: var(--gold-dim); }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid rgba(212, 175, 55, 0.05); padding-bottom: 2px;}

        /* --- [ 시스템 뷰 특화 CSS (아코디언 DB 메뉴) ] --- */
        .db-container { display: flex; flex-direction: column; gap: 10px; }
        
        /* 폴더 (카테고리) */
        .db-folder {
            background: rgba(20, 20, 20, 0.8); border: 1px solid var(--gold-main);
            padding: 12px 15px; font-family: var(--font-title); font-size: 1rem;
            color: var(--gold-bright); cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .db-folder:active { background: rgba(212, 175, 55, 0.2); }
        .db-folder::before { content: '[+] '; color: var(--gold-dim); margin-right: 5px; }
        .db-folder.open::before { content: '[-] '; color: var(--gold-bright); }
        
        /* 폴더 내용 (아이템 리스트) */
        .db-folder-content { display: none; flex-direction: column; gap: 5px; padding-left: 15px; margin-top: -5px; margin-bottom: 10px; border-left: 1px dashed var(--gold-dim); }
        
        /* 파일 (아이템) */
        .db-file {
            padding: 10px; background: rgba(10, 10, 10, 0.6); border: 1px solid rgba(212, 175, 55, 0.3);
            font-size: 0.9rem; color: #fff; cursor: pointer; display: flex; align-items: center; transition: 0.2s;
        }
        .db-file::before { content: '> '; color: var(--gold-dim); margin-right: 8px; font-weight: bold; }
        .db-file:hover, .db-file.active { border-color: var(--gold-main); background: rgba(212, 175, 55, 0.1); }
        
        /* 상세 데이터 출력창 */
        .db-data-box {
            display: none; padding: 15px; background: #050505; border: 1px solid var(--matrix-green);
            color: var(--matrix-green); font-size: 0.8rem; line-height: 1.6; margin-top: -5px;
            box-shadow: inset 0 0 15px rgba(68, 255, 68, 0.1); margin-bottom: 10px; position: relative;
        }
        .db-data-box::after { content: 'END OF FILE_'; display: block; margin-top: 10px; color: var(--gold-dim); font-size: 0.65rem; }
        
        /* 데이터 내부 강조 텍스트 */
        .highlight { color: #fff; background: rgba(212, 175, 55, 0.3); padding: 0 3px; font-family: var(--font-title); }
        .warning { color: var(--danger); font-weight: bold; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="sys-frame-info top-left-info">USER: ADMIN // OS_TERTv2.5 // SYS_CONFIG_ACCESS <span class="blink-dot"></span></div>

    <header>
        <h1 onclick="navTo('lobby')">O.S Terminal</h1>
        <div class="hamburger" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>
    </header>

    <div id="sidebar">
        <div class="menu-item" id="nav-lobby" onclick="navTo('lobby')">> MAIN_LOBBY</div>
        <div class="menu-item active-menu" id="nav-system" onclick="navTo('system')">> SYSTEM_CONFIG</div>
        <div class="sys-btn danger">DISCONNECT</div>
    </div>

    <div id="main-content">
        
        <div id="lobby-view">
            <div class="cyber-border decor-corners lobby-btn" onclick="navTo('system')">
                SYSTEM_CONFIG
                <span style="font-size:0.6rem; color:var(--gold-bright)">DB_ACCESS ></span>
            </div>
            <div class="cyber-border decor-corners log-container">
                <div style="color:var(--gold-main); font-weight:bold; margin-bottom:5px;">SYSTEM_LOG</div>
                <div class="log-entry">[00:00] NET_SECURE. DB LOADED.</div>
            </div>
        </div>

        <div id="system-view" style="display: block;">
            <div class="view-title">
                OS_DATABASE // 설정 열람 <div class="view-title-decor"></div>
            </div>
            
            <div class="db-container" id="db-container">
                </div>
        </div>

    </div>

    <script>
        // --- UI 네비게이션 ---
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
        function navTo(viewId) {
            document.querySelectorAll('#main-content > div').forEach(el => el.style.display = 'none');
            document.getElementById(viewId + '-view').style.display = 'flex';
            if(viewId === 'system') document.getElementById('system-view').style.display = 'block';
            document.getElementById('sidebar').classList.remove('open');
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active-menu'));
            const activeNav = document.getElementById('nav-' + viewId);
            if(activeNav) activeNav.classList.add('active-menu');
            window.scrollTo(0, 0);
        }

        // --- 세계관 DB 데이터 ---
        const systemDB = [
            {
                category: "등급제도 (THREAT_LEVEL)",
                items: [
                    { name: "SS Rank", desc: "<span class='warning'>[국가 멸망 급]</span><br>단일 개체로 국가 시스템 전체를 붕괴시킬 수 있는 재앙적 등급.<br>> 데이터 예시: 애스터 가주" },
                    { name: "S Rank", desc: "<span class='warning'>[도시 멸망 급]</span><br>대도시 하나를 완전히 지도에서 지워버릴 수 있는 파괴력을 지님." },
                    { name: "A Rank", desc: "<span class='highlight'>[소도시 멸망 급]</span><br>국지적 범위의 도시 기능을 마비시키고 파괴할 수 있는 등급." },
                    { name: "B Rank", desc: "<span class='highlight'>[군대 급]</span><br>정규 군대와 맞먹는 전투력을 보유한 수준." },
                    { name: "C Rank", desc: "[일반인 단체 급]<br>다수의 일반인이 무장한 단체를 혼자서 제압 가능한 수준." },
                    { name: "D Rank", desc: "[일반인 급]<br>표준적인 성인 인간의 신체 능력 및 레조넌스 수치." },
                    { name: "E Rank", desc: "[일반인 미만 급]<br>기준치 이하. 전투나 레조넌스 활용 불가." }
                ]
            },
            {
                category: "연주자 (PERFORMERS)",
                items: [
                    { name: "연주자 (능력자)", desc: "소리의 진동으로 물리법칙을 비트는 마력 <span class='highlight'>'레조넌스'</span>를 다루는 각성자.<br>> 각성 시 고유 능력이 뇌리에 각인되며, 레조넌스를 통한 신체강화 및 능력 구사가 가능해진다." },
                    { name: "레조넌스 (Resonance)", desc: "소리의 진동으로 물리법칙을 비트는 이 세계의 <span class='highlight'>마력이자 생명력</span>.<br>> 연주자들은 이 에너지를 다량 보유하고 있으며, 신체강화 및 고유 능력 발동의 에너지원으로 사용한다." },
                    { name: "오버소울 (Over Soul)", desc: "<span class='highlight'>[노이즈 극복 각성 상태]</span><br>기존 대비 능력이 2배 강화되며, 특수 영역인 <span class='highlight'>'커튼콜(Curtain Call)'</span>의 사용이 해방된다." },
                    { name: "커튼콜 (Curtain Call)", desc: "오버소울 도달자가 펼치는 '무대(영역)'. 시전자의 허락 없이는 탈출이 불가능.<br>등급이 낮을수록 유지 시간과 공간 장악력이 비례하여 감소한다.<br><br><span class='highlight'>1. 오버소울 커튼콜</span><br>- 효과: 시간, 위력, 범위 대폭 상승. 능력의 과부하 에너지를 신체로 역류시켜 폭발적인 신체 강화 가능.<br>- 페널티: 종료 후 1분간 과부하로 인한 모든 능력 봉쇄.<br><br><span class='highlight'>2. 생명력 커튼콜</span><br>- 조건: 오버소울 없이 생명력을 직접 연소시켜 강제 발동.<br>- 효과: 오버소울 버전에 비해 전체적인 성능 저하.<br>- 페널티: 종료 후 1분간 모든 능력 봉쇄 및 <span class='warning'>레조넌스 사용 불가</span>. (사실상 일반인 상태로 전락하는 극한의 위험성 보유)" },
                    { name: "백스테이지 (Backstage)", desc: "커튼콜의 '필중 주파수'와 능력을 무효화하는 <span class='highlight'>3m³의 절대 중화 지대</span>.<br>- 외부에서 내부로 진입하는 능력은 즉시 소멸. (영역 이탈 시 해제)<br>- 시전자와 대상의 등급 차이가 2단계 이상일 경우 무효화가 아닌 미세 교란으로 격하됨.<br>- <span class='warning'>제약:</span> 유지 중 시전자는 고유 능력 사용이 봉쇄되며, 오직 레조넌스를 이용한 물리전(신체강화)만 가능." },
                    { name: "조율 (Tuning)", desc: "레조넌스로 몸을 치료하고 노이즈 수치를 대폭 낮추는 고난도 기술.<br>> 연주자 중 극히 일부만 사용 가능하며, 부유층 사이에서 미용 목적으로 고가에 암거래되고 있음." },
                    { name: "노이즈 (Noise)", desc: "<span class='warning'>[경고: 레조넌스 과용 부작용]</span><br>신체 일부가 점차 악기화되며 인간성이 마모되는 현상. 극복 실패 시 '글리치'로 변이함." },
                    { name: "글리치 (Glitch)", desc: "<span class='warning'>[경고: 비인간화 괴물 개체]</span><br>노이즈에 잠식되어 인간성을 잃은 상태.<br>- 수치가 높을수록 기계음 글리치가 발생.<br>- 80% 이상 잠식 시: 모든 대사를 특수문자와 깨진 문자로 출력.<br>> <span class='highlight'>완화 조치:</span> 성적 교감(육체적 접촉)이나 충분한 휴식을 통해 수치를 소폭 완화할 수 있음." }
                ]
            },
            {
                category: "특수현상 (ANOMALIES)",
                items: [
                    { name: "더 뮤트 (The Mute)", desc: "<span class='warning'>[미스터리 공백 현상]</span><br>지정된 공간 내의 모든 레조넌스와 존재가 영구적으로 소거되는 현상." },
                    { name: "lo-fi (로파이)", desc: "<span class='warning'>[마약성 주파수]</span><br>대상에게 몽롱한 쾌락을 제공하지만, 주파수를 뒤틀어 체내 '노이즈 수치'를 폭등시키는 위험 물질." }
                ]
            },
            {
                category: "명령어 (TERMINAL_CMDS)",
                items: [
                    { name: "/scan_resonance", desc: "반경 10km 내의 레조넌스 파동 밀도를 스캔합니다. (현재 권한 대기 중)" },
                    { name: "/auth_override", desc: "<span class='warning'>[접근 거부]</span> 오버소울 관리자 권한이 필요합니다." },
                    { name: "/purge_noise", desc: "단말기 내 임시 노이즈 캐시를 삭제합니다." }
                ]
            }
        ];

        // --- 아코디언 메뉴 렌더링 로직 ---
        const dbContainer = document.getElementById('db-container');

        systemDB.forEach((folderData, fIndex) => {
            // 1. 폴더(카테고리) 생성
            const folder = document.createElement('div');
            folder.className = 'db-folder';
            folder.innerHTML = folderData.category;
            
            const folderContent = document.createElement('div');
            folderContent.className = 'db-folder-content';

            // 2. 파일(아이템) 생성
            folderData.items.forEach((itemData, iIndex) => {
                const file = document.createElement('div');
                file.className = 'db-file';
                file.innerHTML = itemData.name;

                const dataBox = document.createElement('div');
                dataBox.className = 'db-data-box';
                dataBox.innerHTML = itemData.desc;

                // 파일 클릭 시 상세 데이터 출력 이벤트
                file.onclick = function() {
                    const isVisible = dataBox.style.display === 'block';
                    // 같은 폴더 내 다른 데이터창 모두 닫기
                    folderContent.querySelectorAll('.db-data-box').forEach(box => box.style.display = 'none');
                    folderContent.querySelectorAll('.db-file').forEach(f => f.classList.remove('active'));
                    
                    if (!isVisible) {
                        dataBox.style.display = 'block';
                        file.classList.add('active');
                    }
                };

                folderContent.appendChild(file);
                folderContent.appendChild(dataBox);
            });

            // 폴더 클릭 시 파일 목록 출력 이벤트
            folder.onclick = function() {
                const isOpened = folder.classList.contains('open');
                // 모든 폴더 닫기
                document.querySelectorAll('.db-folder').forEach(f => f.classList.remove('open'));
                document.querySelectorAll('.db-folder-content').forEach(fc => fc.style.display = 'none');
                
                if (!isOpened) {
                    folder.classList.add('open');
                    folderContent.style.display = 'flex';
                }
            };

            dbContainer.appendChild(folder);
            dbContainer.appendChild(folderContent);
        });

    </script>
</body>
</html>
