<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OVER SOUL</title>
    <style>
        /* 전체 기본 설정 (검은색 배경, 금색 텍스트) */
        body {
            margin: 0;
            background-color: #0a0a0a; /* 깊고 어두운 검은색 */
            color: #d4af37; /* 고급스러운 금색 */
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 시작 인트로 화면 */
        #intro {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeOut 2.5s forwards;
            animation-delay: 2s; /* 2초 동안 타이틀을 보여준 후 사라짐 */
        }

        #intro h1 {
            font-size: 5rem;
            letter-spacing: 15px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.7); /* 금빛 네온 효과 */
        }

        /* 메인 로비 화면 */
        #lobby {
            opacity: 0; /* 처음엔 숨김 */
            position: absolute;
            top: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 2s forwards;
            animation-delay: 3.5s; /* 인트로가 끝날 때쯤 서서히 나타남 */
        }

        /* 카테고리 메뉴 */
        .nav-menu {
            display: flex;
            gap: 40px;
            margin-top: 30px;
        }

        .nav-menu div {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid #d4af37;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 메뉴에 마우스를 올렸을 때 반전 효과 */
        .nav-menu div:hover {
            background-color: #d4af37;
            color: #0a0a0a;
            box-shadow: 0 0 15px #d4af37;
        }

        /* 임시 지도 영역 표시 */
        .map-preview {
            margin-top: 60px;
            padding: 30px;
            border: 1px dashed #d4af37;
            text-align: center;
        }

        /* 애니메이션 키프레임 */
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        @keyframes fadeIn {
            to { opacity: 1; z-index: 10; }
        }
    </style>
</head>
<body>

    <div id="intro">
        <h1>OVER SOUL</h1>
    </div>

    <div id="lobby">
        <h2 style="font-size: 2rem; letter-spacing: 5px;">MAIN LOBBY</h2>
        
        <div class="nav-menu">
            <div>세계관</div>
            <div>인물</div>
            <div>지도</div>
            <div>시스템</div>
        </div>

        <div class="map-preview">
            <h3>🗺️ U.S. AREA MAP</h3>
            <p>중앙탑 (Central Tower)</p>
            <p>나머지 4개 구역 상세 설정 대기 중...</p>
        </div>
    </div>

</body>
</html>
